[build-system]
requires = ["setuptools >= 61.2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xrlint"
dynamic = ["version", "readme"]
authors = [
  {name = "Norman Fomferra (Brockmann Consult GmbH)"},
  {name = "Alex Kerney (GMRI / NERACOOS)", email = "akerney@gmri.org"}
]
description = "A linter for xarray datasets."
keywords = [
  "xarray", "data-science", "cf", "metadata"
]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
  "click",
  "fsspec",
  "isodate>=0.7.2",
  "pyyaml",
  "tabulate",
  "xarray",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Operating System :: Unix",
  "Operating System :: MacOS",
]

[project.entry-points."xrlint.rules"]
core = "xrlint.plugins.core"
xcube = "xrlint.plugins.xcube"
acdd = "xrlint.plugins.acdd"

[tool.setuptools.dynamic]
version = {attr = "xrlint.__version__"}
readme = {file = "README.md", content-type = "text/markdown"}

[tool.setuptools.packages.find]
exclude = [
  "tests",
  "docs"
]

[tool.flake8]
max-line-length = 88

[tool.isort]
profile = "black"

[tool.ruff]
# There is a problem with ruff when linting imports
exclude = ["**/*.ipynb"]

[project.scripts]
xrlint = "xrlint.cli.main:main"

[project.optional-dependencies]
dev = [
  # Development tools
  "build",
  "hatch",
  "isort",
  "pytest",
  "pytest-cov",
  "ruff",
  "twine",
  # Dataset testing
  "dask",
  "netcdf4",
  "numpy",
  "pandas",
  "zarr>= 2.18, != 3.0.0, != 3.0.1",
]
doc = [
  "mkdocs",
  "mkdocs-autorefs",
  "mkdocs-material",
  "mkdocstrings",
  "mkdocstrings-python",
  "mkdocs-gen-files",
]

[project.urls]
Documentation = "https://bcdev.github.io/xrlint"
Repository = "https://github.com/bcdev/xrlint"
Changelog = "https://github.com/bcdev/xrlint/blob/main/CHANGES.md"
Issues = "https://github.com/bcdev/xrlint/issues"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[tool.pixi.pypi-dependencies]
xrlint = { path = ".", editable = true }

[tool.pixi.feature.ci]
platforms = ["linux-64", "win-64"]

[tool.pixi.environments]
default = { features = ["dev"], dependencies = { python = "3.14.*" } }
py310 = { features = ["dev", "ci"], dependencies = { python = "3.10.*" } }
py311 = { features = ["dev", "ci"], dependencies = { python = "3.11.*" } }
py312 = { features = ["dev", "ci"], dependencies = { python = "3.12.*" } }
py313 = { features = ["dev", "ci"], dependencies = { python = "3.13.*" } }

[tool.pixi.tasks]
format = "ruff format"
checks = "ruff check"
tests = "pytest"

