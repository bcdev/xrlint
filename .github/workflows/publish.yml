name: Package and Publish to PyPi

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [py310, py311, py312, py313]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Pixi
      uses: prefix-dev/setup-pixi@v0.11.3
      with:
        pixi-version: v0.84.2
        environments: ${{ matrix.environment }}
        cache-key: pixi-${{ matrix.environment }}-
        locked: true

    - name: Check formatting with Ruff
      run: pixi run --locked -e ${{ matrix.environment }} format --check

    - name: Lint with Ruff
      run: pixi run --locked -e ${{ matrix.environment }} checks

    - name: Run unit tests
      run: pixi run --locked -e ${{ matrix.environment }} tests --cov=xrlint --cov-branch --cov-report=xml

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        fail_ci_if_error: true
        verbose: true
        token: ${{ secrets.CODECOV_TOKEN }}

  PyPi-Deploy:
    name: Publish Python Package to PyPI
    runs-on: ubuntu-latest
    needs: python-tests

    steps:
    - uses: actions/checkout@v4

    - name: Set up Pixi
      uses: prefix-dev/setup-pixi@v0.11.3
      with:
        pixi-version: v0.84.2
        cache-key: pixi-default-
        locked: true

    - name: Build package
      run: pixi run --locked python -m build

    - name: Publish package to PyPI
      uses: pypa/gh-action-pypi-publish@27b31702a0e7fc50959f5ad993c78deac1bdfc29
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
        verbose: true
