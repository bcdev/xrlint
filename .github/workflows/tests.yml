name: tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [py310, py311, py312, py313]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Pixi
      uses: prefix-dev/setup-pixi@v0.11.3
      with:
        pixi-version: v0.84.2
        environments: ${{ matrix.environment }}
        cache-key: pixi-${{ matrix.environment }}-
        locked: true
    - name: Check formatting with Ruff
      run: pixi run --locked -e ${{ matrix.environment }} format --check
    - name: Lint with Ruff
      run: pixi run --locked -e ${{ matrix.environment }} checks
    - name: Test with pytest
      run: pixi run --locked -e ${{ matrix.environment }} tests --cov=xrlint --cov-branch --cov-report=xml
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: bcdev/xrlint
